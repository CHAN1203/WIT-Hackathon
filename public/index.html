<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaneta Chatbot</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }
        .logo {
            font-size: 2em;
            font-weight: bold;
            color: #f0afaf;
        }
        .nav-links {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            white-space: nowrap;
        }
        .nav-links a:hover {
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">Zaneta</div>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="#project">Project</a>
            <a href="#forum">Forum</a>
            <a href="#profile">Profile</a>
            <a href="#logout">Log Out</a>
        </nav>
    </div>
    
    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="bot-message">
                <span class="bot-text">
                    Hello, I am Zaneta! <br><br>
                    I will be asking a few questions to understand your learning goals so that I can recommend 
                    relevant courses and create a personalised schedule for you!
                </span>
            </div>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Enter a prompt here...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
