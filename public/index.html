<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaneta Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <h2 class="chat-title">Zaneta</h2>
        <div class="chat-box" id="chatBox">
            <div class="bot-message">
                <span class="bot-text">
                    Hello, I am Zaneta! <br><br>
                    I will be asking a few questions to understand your learning goals so that I can recommend 
                    relevant courses and create a personalised schedule for you!
                </span>
            </div>
            
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Enter a prompt here...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
